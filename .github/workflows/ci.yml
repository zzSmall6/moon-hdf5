name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    env:
      # Keep formatter and compiler behavior reproducible across CI runs.
      MOONBIT_INSTALL_VERSION: "0.10.19+bee578715"
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | \
            bash -s -- "$MOONBIT_INSTALL_VERSION"
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain version
        run: moon version --all

      - name: Update dependencies
        run: moon update

      - name: Format
        run: moon fmt --check

      - name: Check
        run: moon check

      - name: Documentation
        run: moon doc

      - name: Package
        run: moon package --list

      - name: Build (wasm)
        run: moon build --target wasm

      - name: Build (native)
        run: moon build --target native

      - name: Test (wasm)
        run: moon test --target wasm

      - name: Test (native)
        run: moon test --target native
